<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex">
<title>확률변수와 확률분포 연습문제 정답</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif:ital,wght@0,400;1,400&display=swap">
<style>
  /* 레이아웃: 휴대폰에서 QR로 여는 한 줄 세로 목록. 세트 A/B 전환 탭 + 문항별 정답 카드, 풀이는 펼쳐 보기 */
  :root {
    --bg: #fbfaf9;
    --surface: #ffffff;
    --fg: #1b1a1a;
    --muted: #6b6464;
    --line: #e6e0de;
    --accent: #c8102e;
    --accent-soft: #fbeef0;
    --font-ui: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --font-math: "Noto Serif", "Times New Roman", Times, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151313; --surface: #1f1c1c; --fg: #efeaea; --muted: #a59d9d;
      --line: #353030; --accent: #ff6b7f; --accent-soft: #3a1f24; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151313; --surface: #1f1c1c; --fg: #efeaea; --muted: #a59d9d;
    --line: #353030; --accent: #ff6b7f; --accent-soft: #3a1f24; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font-ui);
    font-size: 16px; line-height: 1.6; word-break: keep-all;
  }
  .wrap {
    max-width: 640px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px 48px;
    display: flex; flex-direction: column; gap: 20px;
  }
  header { display: flex; flex-direction: column; gap: 4px; border-bottom: 2px solid var(--fg); padding-bottom: 14px; }
  .eyebrow { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: 0.06em; }
  h1 { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -0.02em; text-wrap: balance; }
  h1 span { color: var(--accent); }
  .sub { font-size: 14px; color: var(--muted); }

  nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--bg);
        display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-block: 8px; }
  nav a { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--fg);
          border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 6px; background: var(--surface); }
  nav a b { font-size: 16px; }
  nav a small { font-size: 12px; color: var(--muted); }
  nav a.on { border-color: var(--accent); }
  nav a.on b { color: var(--accent); }
  nav a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  section { display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 80px; }
  section h2 { margin: 6px 0 2px; font-size: 18px; font-weight: 800; display: flex; align-items: baseline; gap: 8px; }
  section h2 small { font-size: 13px; font-weight: 500; color: var(--muted); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
          display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .row { display: flex; align-items: center; gap: 12px; }
  .no { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--fg);
        display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; }
  .tag { flex: 1 1 auto; min-width: 0; font-size: 13px; color: var(--muted); }
  .ans { flex: 0 0 auto; font-size: 22px; font-weight: 800; color: var(--accent);
         font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 4px; }
  details { border-top: 1px dashed var(--line); padding-top: 6px; }
  summary { cursor: pointer; font-size: 14px; font-weight: 700; color: var(--muted); list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "＋ "; }
  details[open] summary::before { content: "－ "; }
  .sol { font-size: 15px; line-height: 1.75; padding: 6px 0 2px; overflow-x: auto; }
  .sol p { margin: 0 0 4px; }

  .m { font-family: var(--font-math); font-style: italic; }
  .mn { font-family: var(--font-math); font-style: normal; }
  .frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center;
          font-family: var(--font-math); font-style: normal; line-height: 1.15; margin: 0 2px; font-size: 0.92em; }
  .frac > span:first-child { border-bottom: 1px solid currentColor; padding: 0 3px; }
  .frac > span:last-child { padding: 0 3px; }
  .ans .frac { font-size: 0.8em; }
  sub, sup { font-size: 0.68em; line-height: 0; }
  .sq { border-top: 1px solid currentColor; padding: 0 2px; }
  footer { font-size: 13px; color: var(--muted); text-align: center; padding-top: 8px; }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
</head><body>

<div class="wrap">
  <header>
    <div class="eyebrow">확률과 통계 · 연습문제 정답</div>
    <h1>확률변수와 <span>확률분포</span></h1>
    <div class="sub">먼저 끝까지 풀어 본 뒤에 정답을 확인하세요.</div>
  </header>

  <nav aria-label="세트 선택">
    <a href="#setA" id="navA"><b>연습문제 A</b><small>기본 1~4번</small></a>
    <a href="#setB" id="navB"><b>연습문제 B</b><small>심화 5~8번</small></a>
  </nav>

  <section id="setA">
    <h2>연습문제 A <small>기본</small></h2>

    <div class="card">
      <div class="row"><div class="no">1</div><div class="tag">확률질량함수의 성질</div><div class="ans">④ <span class="frac"><span>9</span><span>25</span></span></div></div>
    </div>

    <div class="card">
      <div class="row"><div class="no">2</div><div class="tag">확률밀도함수</div><div class="ans"><span class="frac"><span>17</span><span>12</span></span></div></div>
    </div>

    <div class="card">
      <div class="row"><div class="no">3</div><div class="tag">기댓값과 분산</div><div class="ans">② <span class="frac"><span>19</span><span>2</span></span></div></div>
    </div>

    <div class="card">
      <div class="row"><div class="no">4</div><div class="tag">확률분포의 활용</div><div class="ans">70</div></div>
    </div>
  </section>

  <section id="setB">
    <h2>연습문제 B <small>심화</small></h2>

    <div class="card">
      <div class="row"><div class="no">5</div><div class="tag">확률질량함수의 성질</div><div class="ans">① <span class="frac"><span>1</span><span>6</span></span></div></div>
    </div>

    <div class="card">
      <div class="row"><div class="no">6</div><div class="tag">확률밀도함수</div><div class="ans">29</div></div>
    </div>

    <div class="card">
      <div class="row"><div class="no">7</div><div class="tag">기댓값과 분산</div><div class="ans">③ 19</div></div>
    </div>

    <div class="card">
      <div class="row"><div class="no">8</div><div class="tag">확률분포의 활용</div><div class="ans">98</div></div>
    </div>
  </section>

  <footer>확률변수와 확률분포 · 이것만은 반드시 연습문제</footer>
</div>

<script>
  (function () {
    var a = document.getElementById('navA'), b = document.getElementById('navB');
    function mark() {
      var onB = location.hash === '#setB';
      a.classList.toggle('on', !onB); b.classList.toggle('on', onB);
    }
    window.addEventListener('hashchange', mark); mark();
  })();
</script>
</body></html>
